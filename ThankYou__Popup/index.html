<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact Form</title>
    <link rel="stylesheet" href="assets/css/app.css">
    <script src="assets/js/app.js" defer></script>
</head>

<body>
    <div class="form-container">
        <form id="contactForm">
            <h1 class="formHeading">
                Contact Form
            </h1>
            <div class="form-group">
                <div>
                    <label for="firstName">First Name</label>
                    <input type="text" id="firstName" name="firstName">
                    <div class="error-message" id="firstNameError">First Name is required</div>
                </div>
                <div>
                    <label for="lastName">Last Name</label>
                    <input type="text" id="lastName" name="lastName">
                    <div class="error-message" id="lastNameError">Last Name is required</div>
                </div>
            </div>

            <div class="form-group full-width">
                <label for="email">Email</label>
                <input type="email" id="email" name="email">
                <div class="error-message" id="emailError">Email is required</div>
            </div>

            <div class="form-group">
                <div id="phoneField" style="display: none;">
                    <label for="phone">Phone</label>
                    <input type="text" id="phone" name="phone">
                    <div class="error-message" id="phoneError">Phone is required</div>
                </div>
                <div id="addressField" style="display: none;">
                    <label for="address">Address</label>
                    <input type="text" id="address" name="address">
                    <div class="error-message" id="addressError">Address is required</div>
                </div>
            </div>


            <!-- Submit Button -->
            <button type="submit" class="submit-btn">Submit</button>
        </form>
    </div>
</body>

</html>
