<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Profile Card</title>
    <link rel="stylesheet" href="assets/css/app.css">
    <script src="https://kit.fontawesome.com/e89c4715d9.js" defer></script>
</head>

<body>
    <div class="profile-card">
        <div class="image">
            <img src="assets/image/profile.jpeg" alt="Ui Card" class="profile-img">
        </div>
        <div class="text-data">
            <span class="name">User Name</span>
            <span class="job">Developer & Designer</span>
        </div>
        <div class="media-buttons">
            <a href="#" target="_blank" style="background: #4267b2;" class="link">
                <i class="fa-brands fa-facebook"></i>
            </a>
            <a href="#" style="background: #1da1f2;" class="link">
                <i class="fa-brands fa-twitter"></i>
            </a>
            <a href="#" target="_blank" style="background: #e1306c;" class="link">
                <i class="fa-brands fa-instagram"></i>
            </a>
            <a href="#" style="background: #ff0000;" class="link">
                <i class="fa-brands fa-youtube"></i>
            </a>
        </div>
        <div class="buttons">
            <button class="button">Subscribe</button>
            <button id="chatbtn" class="button">Message</button>
        </div>
        <div class="analytics">
            <div class="data">
                <i class="fa-regular fa-heart" id="heart-icon"></i>
                <span class="number" id="like-count">60k</span>
            </div>
            <div class="data">
                <i class="fa-regular fa-comment" id="comment-icon"></i>
                <span class="number">20k</span>
            </div>
            <div class="data">
                <i class="fa-regular fa-share-from-square"></i>
                <span class="number">12k</span>
            </div>

        </div>
    </div>
    <script src="assets/js/app.js"></script>
    <script src="assets/js/app.js"></script>
</body>

</html>
