<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- BOOTSRAP JS -->
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha3/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <!-- BOOTSRAP CSS -->
    <script
      src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha3/dist/js/bootstrap.bundle.min.js"
      defer
    ></script>
    <!-- Font-AWESOME -->
    <script
      src="https://kit.fontawesome.com/1f2409d129.js"
      crossorigin="anonymous"
      defer
    ></script>
    <!-- CUSTOM CSS -->
    <link rel="stylesheet" href="assets/css/variable.css" />
    <link rel="stylesheet" href="assets/css/generic.css" />
    <link rel="stylesheet" href="assets/css/app.css" />

    <title>Dev folio</title>
  </head>
  <body>
    <div class="container mt-5">
      <h1 class="text-center mb-4">Human-Machine Interaction Tracker</h1>

      <!-- Form Section -->
      <form id="interaction-form" class="mb-4">
        <div class="mb-3">
          <label for="interactionType" class="form-label"
            >Interaction Type</label
          >
          <input
            type="text"
            class="form-control"
            id="interactionType"
            placeholder="e.g., Voice Command"
          />
        </div>
        <div class="mb-3">
          <label for="satisfactionLevel" class="form-label"
            >Satisfaction Level</label
          >
          <select id="satisfactionLevel" class="form-select">
            <option value="1">1 - Very Dissatisfied</option>
            <option value="2">2 - Dissatisfied</option>
            <option value="3">3 - Neutral</option>
            <option value="4">4 - Satisfied</option>
            <option value="5">5 - Very Satisfied</option>
          </select>
        </div>
        <div class="mb-3">
          <label for="successRate" class="form-label">Success Rate</label>
          <input
            type="range"
            class="form-range"
            id="successRate"
            min="0"
            max="100"
          />
          <small id="successRateValue" class="form-text">50%</small>
        </div>
        <div class="mb-3">
          <label for="ageGroup" class="form-label">Age Group</label>
          <select id="ageGroup" class="form-select">
            <option value="Under 18">Under 18</option>
            <option value="18-30">18-30</option>
            <option value="31-50">31-50</option>
            <option value="50+">50+</option>
          </select>
        </div>
        <button type="button" class="btn btn-primary" id="submitData">
          Submit
        </button>
      </form>

      <!-- Data Table Section -->
      <h3 class="mb-3">Recorded Data</h3>
      <table class="table table-striped" id="data-table">
        <thead>
          <tr>
            <th>#</th>
            <th>Interaction Type</th>
            <th>Satisfaction Level</th>
            <th>Success Rate</th>
            <th>Age Group</th>
          </tr>
        </thead>
        <tbody></tbody>
      </table>
    </div>

    <script src="assets/js/app.js"></script>
  </body>
</html>
