<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <!-- BOOTSRAP JS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha3/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- BOOTSRAP CSS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha3/dist/js/bootstrap.bundle.min.js" defer></script>
    <!-- Font-AWESOME -->
    <script src="https://kit.fontawesome.com/1f2409d129.js" crossorigin="anonymous" defer></script>
    <link rel="icon" type="image/x-icon" href="logo w.png">
    <title>Password Generater</title>
    <link rel="stylesheet" href="app.css">
</head>

<body>

    <div id="container">
        <img class="w-75 mx-4" src="logo.png" alt="">
        <h1 class="text-center mt-5">Password Generator</h1>
        <div class="card">
            <div class="d-flex align-items-center">
                <input type="text" id="input" readonly>
                <button id="copyButton" class="ms-5">
                    <i class="fa-regular fa-copy"></i>
                </button>
            </div>
            <button id="button">Generate Password</button>
        </div>

    </div>

    <script src="app.js"></script>
</body>

</html>
